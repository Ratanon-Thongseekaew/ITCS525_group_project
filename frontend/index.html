<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Textile Track application" />
    <link rel="icon" type="image/png" href="/src/assets/logos/textile-track-app-logo-1024.png" />
    <title>Textile Track</title>
    <script>
      // Apply the saved theme before the app loads, so a dark page doesn't flash light first.
      // next-themes stores the choice under "theme" and keeps the class in step afterwards.
      ;(function () {
        var root = document.documentElement
        try {
          var theme = localStorage.getItem('theme')
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.classList.add(dark ? 'dark' : 'light')
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          root.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
