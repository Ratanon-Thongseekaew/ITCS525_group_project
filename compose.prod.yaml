name: textile-track

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-textile_track}
      MYSQL_USER: ${MYSQL_USER:-textile_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  backend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/textile-track-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-textile_track}
      MYSQL_USER: ${MYSQL_USER:-textile_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/backend/uploads}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_network

  frontend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/textile-track-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
      ALLOWED_CLIENT_CIDRS: ${ALLOWED_CLIENT_CIDRS:-0.0.0.0/0 ::/0}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
