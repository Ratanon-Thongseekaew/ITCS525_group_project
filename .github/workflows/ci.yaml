name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql+pymysql://textile_app:ci-app-password@127.0.0.1:3306/textile_track
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: textile_track
          MYSQL_USER: textile_app
          MYSQL_PASSWORD: ci-app-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]"

      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Check migration metadata
        run: alembic -c backend/alembic.ini check

      - name: Run Ruff lint
        run: python -m ruff check backend

      - name: Check Ruff formatting
        run: python -m ruff format --check backend

      - name: Run backend tests
        run: python -m pytest backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run project guardrails
        run: npm run guardrails

      - name: Test project guardrails
        run: npm run test:guardrails

      - name: Check Prettier formatting
        run: npx prettier --check "**/*.{js,cjs,mjs,jsx,ts,tsx,json,css,md,yml,yaml}"

      - name: Run frontend lint
        run: npm run lint --workspace frontend

      - name: Run frontend tests
        run: npm run test --workspace frontend

      - name: Build frontend
        run: npm run build --workspace frontend

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_DATABASE: textile_track
      MYSQL_USER: textile_app
      MYSQL_PASSWORD: ci-app-password
      MYSQL_PORT: '3307'
      JWT_SECRET: ci-only-secret-value-that-is-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet
