name: textile-track

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-textile_track}
      MYSQL_USER: ${MYSQL_USER:-textile_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-textile_track}
      MYSQL_USER: ${MYSQL_USER:-textile_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      UPLOAD_DIR: /app/backend/uploads
    command:
      - sh
      - -c
      - alembic -c backend/alembic.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '127.0.0.1:${LOCAL_API_PORT:-8000}:8000'
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${LOCAL_SITE_DOMAIN:-:80}
      ALLOWED_CLIENT_CIDRS: 0.0.0.0/0 ::/0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${LOCAL_WEB_PORT:-5173}:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
